name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten 6.0.5
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.5
      - name: Rebuild committed WebAssembly artifacts
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run build:wasm
      - name: Check generated artifacts are current
        run: git diff --exit-code -- public/voicechat-runtime.js public/voicechat-runtime.wasm
